# Unused by the app. Metadata is in Cloudflare D1. No npm script starts this.
services:
  db:
    image: postgres:17-alpine
    container_name: cloudflare-git-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cloudflare_git
    ports:
      - "55432:5432"
    volumes:
      - cloudflare-git-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cloudflare_git"]
      interval: 2s
      timeout: 5s
      retries: 20

  test-db:
    image: postgres:17-alpine
    container_name: cloudflare-git-test-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cloudflare_git_test
    ports:
      - "55433:5432"
    volumes:
      - cloudflare-git-test-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cloudflare_git_test"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  cloudflare-git-postgres:
  cloudflare-git-test-postgres:
