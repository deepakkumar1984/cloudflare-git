services:
  db:
    image: postgres:17-alpine
    container_name: deesha-git-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: deesha_git
    ports:
      - "55432:5432"
    volumes:
      - deesha-git-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deesha_git"]
      interval: 2s
      timeout: 5s
      retries: 20

  test-db:
    image: postgres:17-alpine
    container_name: deesha-git-test-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: deesha_git_test
    ports:
      - "55433:5432"
    volumes:
      - deesha-git-test-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deesha_git_test"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  deesha-git-postgres:
  deesha-git-test-postgres:
